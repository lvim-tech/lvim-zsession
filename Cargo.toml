[package]
name = "lvim-zsession"
version = "0.5.0"
edition = "2021"
authors = ["lvim-tech"]
description = "Session resurrection companion for zellij: when a resurrected program pane exits, a shell takes its place (no dead pane), plus save-session from a keybind"
license = "BSD-3-Clause"

[dependencies]
# The keyboard layouts (`layout.rs`).
lvim-zlayout = { git = "https://github.com/lvim-tech/lvim-zlayout", rev = "15eda3d9cf99c46c67f90e15ac087da70f4ab579" }
zellij-tile = { git = "https://github.com/zellij-org/zellij", rev = "644d78cecac14ac77d37fe7b9b1eacbedeec1691" }

[profile.release]
lto = true
opt-level = "z"
strip = true
