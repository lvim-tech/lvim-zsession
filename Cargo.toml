[package]
name = "lvim-zsession"
version = "0.5.0"
edition = "2021"
authors = ["lvim-tech"]
description = "Session resurrection companion for zellij: when a resurrected program pane exits, a shell takes its place (no dead pane), plus save-session from a keybind"
license = "BSD-3-Clause"

[dependencies]
zellij-tile = "0.44.3"

[profile.release]
lto = true
opt-level = "z"
strip = true
